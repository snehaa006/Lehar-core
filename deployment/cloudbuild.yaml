# Cloud Build configuration for automatic deployment to Cloud Run
# This file automates: Build Docker image → Push to Container Registry → Deploy to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lehar-core-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lehar-core-app:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lehar-core-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lehar-core-app:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lehar-core-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lehar-core-app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FLASK_ENV=production,GCS_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=lehar-core-prod'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,MAIL_USERNAME=MAIL_USERNAME:latest,MAIL_PASSWORD=MAIL_PASSWORD:latest'

images:
  - 'gcr.io/$PROJECT_ID/lehar-core-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lehar-core-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
