{% extends "base.html" %}

{% block title %}HR Reports{% endblock %}

{% block content %}
<div class="container mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Manhours & Allocation Reports</h1>
            <p class="text-gray-600 mt-1">View department-wise manhours and workforce statistics</p>
        </div>
        <a href="{{ url_for('hr_portal.hr_home', workspace_id=workspace_id) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">← Back</a>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                <input type="date" id="start-date" class="px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                <input type="date" id="end-date" class="px-4 py-2 border rounded-lg">
            </div>
            <div class="flex items-end">
                <button id="generate-report-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">Generate Report</button>
            </div>
        </div>

        <div id="report-content" class="mt-6">
            <p class="text-center text-gray-500 py-12">Select date range and click "Generate Report"</p>
        </div>
    </div>
</div>

<script>
const API_BASE = "/hr/{{ workspace_id }}/api";

document.getElementById('generate-report-btn').addEventListener('click', async () => {
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    if (!startDate || !endDate) { alert('Please select both dates'); return; }

    const content = document.getElementById('report-content');
    content.innerHTML = '<p class="text-center text-gray-500 py-8">Loading report...</p>';

    try {
        const res = await fetch(`${API_BASE}/reports/summary?start_date=${startDate}&end_date=${endDate}`);
        const result = await res.json();
        if (!res.ok) { content.innerHTML = `<p class="text-center text-red-500 py-8">${result.error}</p>`; return; }

        if (!result.data || !result.data.length) {
            content.innerHTML = '<p class="text-center text-gray-500 py-8">No data found for this period</p>';
            return;
        }

        let html = '<div class="overflow-x-auto"><table class="min-w-full"><thead class="bg-gray-50"><tr>';
        html += '<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>';
        html += '<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total Workers</th>';
        html += '<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Present</th>';
        html += '<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Absent</th>';
        html += '<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Manhours</th>';
        html += '</tr></thead><tbody class="divide-y divide-gray-200">';

        result.data.forEach(d => {
            html += `<tr>
                <td class="px-4 py-3 text-sm">${d.date}</td>
                <td class="px-4 py-3 text-sm">${d.total_workers}</td>
                <td class="px-4 py-3 text-sm text-green-600 font-medium">${d.total_present}</td>
                <td class="px-4 py-3 text-sm text-red-600 font-medium">${d.total_absent}</td>
                <td class="px-4 py-3 text-sm">${d.total_manhours.toFixed(1)}</td>
            </tr>`;
        });
        html += '</tbody></table></div>';
        content.innerHTML = html;
    } catch (e) { content.innerHTML = `<p class="text-center text-red-500 py-8">Error: ${e.message}</p>`; }
});
</script>
{% endblock %}
