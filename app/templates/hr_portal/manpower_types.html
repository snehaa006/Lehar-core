{% extends "base.html" %}

{% block title %}Manage Manpower Types{% endblock %}

{% block content %}
<div class="container mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Manage Manpower Types</h1>
            <p class="text-gray-600 mt-1">Define workforce categories (Operator, Fitter, Helper, etc.)</p>
        </div>
        <div class="flex gap-3">
            <button id="add-type-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                + Add Type
            </button>
            <a href="{{ url_for('hr_portal.hr_home', workspace_id=workspace_id) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
                ← Back
            </a>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="types-grid">
            <!-- Types will be loaded here -->
        </div>
    </div>
</div>

<div id="type-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
        <h3 class="text-xl font-bold mb-4">Add Manpower Type</h3>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type Name</label>
            <input type="text" id="type-name" placeholder="e.g., Supervisor, Cleaner" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button id="cancel-btn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-lg">Cancel</button>
            <button id="save-type-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Save</button>
        </div>
    </div>
</div>

<script>
const API_BASE = "/hr/{{ workspace_id }}/api";

async function loadTypes() {
    try {
        const res = await fetch(`${API_BASE}/manpower-types`);
        const types = await res.json();
        const grid = document.getElementById('types-grid');
        grid.innerHTML = '';
        if (!types.length) { grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-8">No manpower types yet. Click "+ Add Type" to create one.</p>'; return; }
        types.forEach(t => {
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-4 rounded-lg flex items-center justify-between';
            div.innerHTML = `<span class="font-medium text-gray-800">${t.name}</span>
                <button onclick="deleteType('${t.id}','${t.name}')" class="text-red-500 hover:text-red-700 text-sm">Archive</button>`;
            grid.appendChild(div);
        });
    } catch (e) { console.error('Failed to load types:', e); }
}

function showModal() { document.getElementById('type-modal').classList.remove('hidden'); document.getElementById('type-modal').classList.add('flex'); document.getElementById('type-name').value = ''; }
function hideModal() { document.getElementById('type-modal').classList.add('hidden'); document.getElementById('type-modal').classList.remove('flex'); }

document.getElementById('add-type-btn').addEventListener('click', showModal);
document.getElementById('cancel-btn').addEventListener('click', hideModal);
document.getElementById('save-type-btn').addEventListener('click', async () => {
    const name = document.getElementById('type-name').value.trim();
    if (!name) { alert('Name is required'); return; }
    try {
        const res = await fetch(`${API_BASE}/manpower-types`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name}) });
        const result = await res.json();
        if (!res.ok) { alert(result.error || 'Failed'); return; }
        hideModal(); loadTypes();
    } catch (e) { alert('Error: ' + e.message); }
});

async function deleteType(id, name) {
    if (!confirm(`Archive manpower type "${name}"?`)) return;
    try {
        const res = await fetch(`${API_BASE}/manpower-types/${id}`, { method: 'DELETE' });
        if (res.ok) loadTypes();
        else alert('Failed to archive');
    } catch (e) { alert('Error: ' + e.message); }
}

loadTypes();
</script>
{% endblock %}
