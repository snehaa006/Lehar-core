{% extends "base.html" %}

{% block title %}Manage Manpower Types{% endblock %}

{% block content %}
<div class="container mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Manage Manpower Types</h1>
            <p class="text-gray-600 mt-1">Define workforce categories (Operator, Fitter, Helper, etc.)</p>
        </div>
        <div class="flex gap-3">
            <button id="add-type-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                + Add Type
            </button>
            <a href="{{ url_for('hr_portal.hr_home') }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
                ← Back
            </a>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="types-grid">
            <!-- Types will be loaded here -->
        </div>
    </div>
</div>

<div id="type-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
        <h3 class="text-xl font-bold mb-4">Add Manpower Type</h3>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type Name</label>
            <input type="text" id="type-name" placeholder="e.g., Supervisor, Cleaner" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button id="cancel-btn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-lg">Cancel</button>
            <button id="save-type-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Save</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/hr_manpower_types.js') }}"></script>
{% endblock %}
