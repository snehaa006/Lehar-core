{% extends "base.html" %}

{% block title %}Manage Departments{% endblock %}

{% block content %}
<div class="container mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Manage Departments</h1>
            <p class="text-gray-600 mt-1">Create, edit, and archive departments</p>
        </div>
        <div class="flex gap-3">
            <button id="add-dept-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                + Add Department
            </button>
            <a href="{{ url_for('hr_portal.hr_home', workspace_id=workspace_id) }}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
                ← Back
            </a>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6">
        <table class="min-w-full" id="depts-table">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Head/Manager</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody id="depts-tbody" class="divide-y divide-gray-200"></tbody>
        </table>
    </div>
</div>

<div id="dept-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
        <h3 id="modal-title" class="text-xl font-bold mb-4">Add Department</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Department Name</label>
                <input type="text" id="dept-name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Head/Manager</label>
                <input type="text" id="dept-head" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="dept-desc" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
            <button id="cancel-btn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-lg">Cancel</button>
            <button id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Save</button>
        </div>
    </div>
</div>

<script>
const API_BASE = "/hr/{{ workspace_id }}/api";
let editingDeptId = null;

async function loadDepartments() {
    try {
        const res = await fetch(`${API_BASE}/departments`);
        const depts = await res.json();
        const tbody = document.getElementById('depts-tbody');
        tbody.innerHTML = '';
        depts.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="px-6 py-4 text-sm font-medium text-gray-900">${d.name}</td>
                <td class="px-6 py-4 text-sm text-gray-600">${d.head || '-'}</td>
                <td class="px-6 py-4 text-sm text-gray-600">${d.description || '-'}</td>
                <td class="px-6 py-4 text-sm">
                    <button onclick="editDept('${d.id}','${d.name}','${d.head || ''}','${d.description || ''}')" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                    <button onclick="deleteDept('${d.id}','${d.name}')" class="text-red-600 hover:text-red-800">Archive</button>
                </td>`;
            tbody.appendChild(tr);
        });
    } catch (e) { console.error('Failed to load departments:', e); }
}

function showModal(title, name='', head='', desc='') {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('dept-name').value = name;
    document.getElementById('dept-head').value = head;
    document.getElementById('dept-desc').value = desc;
    document.getElementById('dept-modal').classList.remove('hidden');
    document.getElementById('dept-modal').classList.add('flex');
}

function hideModal() {
    document.getElementById('dept-modal').classList.add('hidden');
    document.getElementById('dept-modal').classList.remove('flex');
    editingDeptId = null;
}

document.getElementById('add-dept-btn').addEventListener('click', () => { editingDeptId = null; showModal('Add Department'); });
document.getElementById('cancel-btn').addEventListener('click', hideModal);
document.getElementById('save-btn').addEventListener('click', async () => {
    const data = { name: document.getElementById('dept-name').value, head: document.getElementById('dept-head').value, description: document.getElementById('dept-desc').value };
    const url = editingDeptId ? `${API_BASE}/departments/${editingDeptId}` : `${API_BASE}/departments`;
    const method = editingDeptId ? 'PUT' : 'POST';
    try {
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        if (!res.ok) { alert(result.error || 'Failed'); return; }
        hideModal(); loadDepartments();
    } catch (e) { alert('Error: ' + e.message); }
});

function editDept(id, name, head, desc) { editingDeptId = id; showModal('Edit Department', name, head, desc); }
async function deleteDept(id, name) {
    if (!confirm(`Archive department "${name}"?`)) return;
    try {
        const res = await fetch(`${API_BASE}/departments/${id}`, { method: 'DELETE' });
        if (res.ok) loadDepartments();
        else alert('Failed to archive');
    } catch (e) { alert('Error: ' + e.message); }
}

loadDepartments();
</script>
{% endblock %}
