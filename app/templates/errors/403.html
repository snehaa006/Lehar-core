{% extends "base.html" %}

{% block title %}Access Forbidden - Lehar Core{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <h1 class="text-8xl font-bold text-red-500 mb-4">403</h1>
        <h2 class="text-2xl font-semibold text-text-primary mb-4">Access Forbidden</h2>
        <p class="text-text-muted mb-8">You don't have permission to access this resource.</p>
        <div class="space-x-4">
            <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 btn-primary rounded-lg text-dark-bg font-semibold">
                Go Home
            </a>
            <a href="{{ url_for('dashboard.index') }}" class="inline-block px-6 py-3 bg-dark-border hover:bg-dark-card text-text-secondary rounded-lg font-semibold transition-colors">
                Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
