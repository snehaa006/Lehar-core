{% extends "base.html" %}

{% block title %}Login - Lehar Core{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <!-- Logo and Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-cyan-bright to-cyan-dark rounded-2xl mb-4">
                <span class="text-white font-bold text-2xl">L</span>
            </div>
            <h1 class="text-3xl font-bold text-text-primary">Welcome back</h1>
            <p class="text-text-muted mt-2">Sign in to your Lehar Core account</p>
        </div>

        <!-- Login Form -->
        <div class="bg-dark-card border border-dark-border rounded-2xl p-8">
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-text-secondary mb-2">Email address</label>
                    <input type="email" id="email" name="email"
                           value="{{ form_data.email if form_data else '' }}"
                           class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg text-text-primary placeholder-text-muted focus:border-cyan-bright"
                           placeholder="you@company.com" required>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-text-secondary mb-2">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg text-text-primary placeholder-text-muted focus:border-cyan-bright"
                           placeholder="Enter your password" required>
                </div>

                <!-- Remember me -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded border-dark-border bg-dark-bg text-cyan-bright focus:ring-cyan-bright">
                        <span class="ml-2 text-sm text-text-muted">Remember me</span>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full btn-primary py-3 px-4 rounded-lg text-white font-semibold">
                    Sign in
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-dark-border"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-dark-card text-text-muted">New to Lehar Core?</span>
                </div>
            </div>

            <!-- Sign up links -->
            <div class="space-y-3">
                <a href="{{ url_for('auth.discover_workspaces') }}" class="block w-full py-3 px-4 text-center border border-cyan-bright text-cyan-bright rounded-lg hover:bg-cyan-bright hover:text-dark-bg transition-colors">
                    Find your workspace
                </a>
                <a href="{{ url_for('auth.signup') }}" class="block w-full py-3 px-4 text-center border border-dark-border text-text-secondary rounded-lg hover:border-text-secondary transition-colors">
                    Create new organization
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
