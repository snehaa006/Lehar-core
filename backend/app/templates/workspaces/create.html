{% extends "base.html" %}

{% block title %}Create Workspace - Lehar Core{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <a href="{{ url_for('workspaces.list_workspaces') }}" class="text-text-muted hover:text-cyan-bright text-sm mb-4 inline-flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Workspaces
        </a>
        <h1 class="text-2xl font-bold text-text-primary mt-4">Create New Workspace</h1>
        <p class="text-text-muted mt-1">Set up a new workspace for your team</p>
    </div>

    <!-- Create Form -->
    <div class="bg-dark-card border border-dark-border rounded-xl overflow-hidden">
        <form method="POST" action="{{ url_for('workspaces.create_workspace') }}" class="p-6 space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-text-secondary mb-2">Workspace Name *</label>
                <input type="text" id="name" name="name" required
                       placeholder="e.g., Engineering Team"
                       class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg text-text-primary placeholder-text-muted focus:border-cyan-bright focus:ring-1 focus:ring-cyan-bright">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-text-secondary mb-2">Description</label>
                <textarea id="description" name="description" rows="3"
                          placeholder="Describe what this workspace is for..."
                          class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg text-text-primary placeholder-text-muted focus:border-cyan-bright focus:ring-1 focus:ring-cyan-bright"></textarea>
            </div>

            <div>
                <label for="workspace_type" class="block text-sm font-medium text-text-secondary mb-2">Workspace Type *</label>
                <select id="workspace_type" name="workspace_type" required
                        class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg text-text-primary focus:border-cyan-bright focus:ring-1 focus:ring-cyan-bright">
                    <option value="general">General</option>
                    <option value="hr">HR</option>
                    <option value="engineering">Engineering</option>
                    <option value="manufacturing">Manufacturing</option>
                    <option value="plant">Plant</option>
                    <option value="inventory">Inventory</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="is_discoverable" name="is_discoverable" value="true" checked
                       class="w-4 h-4 text-cyan-bright bg-dark-bg border-dark-border rounded focus:ring-cyan-bright">
                <label for="is_discoverable" class="ml-2 text-sm text-text-secondary">
                    Allow users from the same domain to discover and request to join
                </label>
            </div>

            <div class="pt-4 border-t border-dark-border">
                <button type="submit" class="w-full px-6 py-3 btn-primary rounded-lg text-dark-bg font-semibold">
                    Create Workspace
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
