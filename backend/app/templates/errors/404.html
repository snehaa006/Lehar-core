{% extends "base.html" %}

{% block title %}Page Not Found - Lehar Core{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <h1 class="text-8xl font-bold text-cyan-bright mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-text-primary mb-4">Page Not Found</h2>
        <p class="text-text-muted mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 btn-primary rounded-lg text-dark-bg font-semibold">
            Go Home
        </a>
    </div>
</div>
{% endblock %}
