{% extends "base.html" %}

{% block title %}Server Error - Lehar Core{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center">
        <h1 class="text-8xl font-bold text-amber-500 mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-text-primary mb-4">Internal Server Error</h2>
        <p class="text-text-muted mb-8">Something went wrong on our end. Please try again later.</p>
        <div class="space-x-4">
            <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 btn-primary rounded-lg text-dark-bg font-semibold">
                Go Home
            </a>
            <button onclick="location.reload()" class="inline-block px-6 py-3 bg-dark-border hover:bg-dark-card text-text-secondary rounded-lg font-semibold transition-colors">
                Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
