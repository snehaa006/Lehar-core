{% extends "base.html" %}

{% block title %}Welcome - Lehar Core Platform{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8">
    <!-- Hero Section -->
    <div class="text-center max-w-2xl mx-auto">
        <!-- Logo/Brand -->
        <div class="mb-8">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-cyan-bright to-cyan-dark rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-dark/30">
                <svg class="w-10 h-10 text-dark-bg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
        </div>

        <h1 class="text-4xl sm:text-5xl font-bold text-text-primary mb-4">
            Lehar Core Platform
        </h1>
        <p class="text-xl text-text-muted mb-12">
            Multi-tenant Industrial ERP System
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16">
            <a href="{{ url_for('auth.login') }}"
               class="w-full sm:w-auto px-8 py-4 btn-primary rounded-lg text-dark-bg font-semibold text-lg transition-all hover:scale-105 shadow-lg shadow-cyan-dark/30">
                Login
            </a>
            <a href="{{ url_for('auth.signup') }}"
               class="w-full sm:w-auto px-8 py-4 bg-dark-card border border-dark-border rounded-lg text-text-primary font-semibold text-lg hover:border-cyan-bright hover:text-cyan-bright transition-all">
                Create Account
            </a>
        </div>

        <!-- Features Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-4 bg-dark-card border border-dark-border rounded-xl">
                <div class="w-10 h-10 mx-auto mb-3 bg-cyan-dark/20 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-cyan-bright" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
                <p class="text-text-secondary text-sm">Multi-tenant Organizations</p>
            </div>
            <div class="p-4 bg-dark-card border border-dark-border rounded-xl">
                <div class="w-10 h-10 mx-auto mb-3 bg-purple-900/30 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <p class="text-text-secondary text-sm">Role-based Access Control</p>
            </div>
            <div class="p-4 bg-dark-card border border-dark-border rounded-xl">
                <div class="w-10 h-10 mx-auto mb-3 bg-green-900/30 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <p class="text-text-secondary text-sm">Team Invitations</p>
            </div>
            <div class="p-4 bg-dark-card border border-dark-border rounded-xl">
                <div class="w-10 h-10 mx-auto mb-3 bg-amber-900/30 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
                    </svg>
                </div>
                <p class="text-text-secondary text-sm">Multi-workspace Support</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
